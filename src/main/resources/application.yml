server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: student-platform
  mvc:
    async:
      # 非流式问答改为 MVC 异步后，容器线程立刻归还，但异步请求本身有超时。
      # 不设就落到 Tomcat 默认 30s，AI 生成（最长 120s）会被掐断成 AsyncRequestTimeoutException。
      request-timeout: 200000
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/student_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

jwt:
  # 必填：运行时必须通过环境变量 JWT_SECRET 注入不少于 32 字节的强密钥。
  # 留空时开发环境会生成一次性随机密钥（重启后旧 token 失效），
  # 若仍为曾经写死的弱默认值则会直接拒绝启动（见 JwtSecretProvider）。
  secret: ${JWT_SECRET:}
  # 访问令牌 15 分钟：它无法被主动作废以外的方式收回，签发越久风险窗口越大。
  # 过期后由前端用刷新令牌静默续期（见 api.js 拦截器），不会打断用户操作。
  expiration: 900000
  refresh-expiration: 604800000

app:
  cors:
    # 显式来源白名单，逗号分隔。前端开发走 Vite 代理（同源），跨源部署时由环境变量覆盖。
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

langchain4j:
  open-ai:
    # 文本对话：DeepSeek-V4.1-Flash（deepseek-flash，响应快；思考模式在 AiConfig 中关闭）
    chat-model:
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: deepseek-flash
      log-requests: false
      log-responses: false
    streaming-chat-model:
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: deepseek-flash
    # 视觉理解：deepseek-flash 原生支持图片输入（input_modalities: text+image）
    vision-chat-model:
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: deepseek-flash

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  # 注意：不配置 type-aliases-package，各服务存在同名实体类（如 User）会引发别名冲突；
  # 所有 Mapper XML 均使用全限定类名，无需别名。
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
    # 生产应设为 false：文档白名单放行是为了开发方便，但它等于把全部端点公开
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${API_DOCS_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.student.platform: DEBUG
  file:
    name: logs/student-platform.log
