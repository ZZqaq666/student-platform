server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: student-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/student_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 8
          min-idle: 0
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    virtual-host: ${RABBIT_VHOST:/}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

jwt:
  # 必填：运行时必须通过环境变量 JWT_SECRET 注入不少于 32 字节的强密钥。
  # 留空时开发环境会生成一次性随机密钥（重启后旧 token 失效），
  # 若仍为曾经写死的弱默认值则会直接拒绝启动（见 JwtSecretProvider）。
  secret: ${JWT_SECRET:}
  expiration: 86400000

langchain4j:
  open-ai:
    # 文本对话：DeepSeek-V4.1-Flash（deepseek-flash，响应快；思考模式在 AiConfig 中关闭）
    chat-model:
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: deepseek-flash
      log-requests: false
      log-responses: false
    streaming-chat-model:
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: deepseek-flash
    # 视觉理解：deepseek-flash 原生支持图片输入（input_modalities: text+image）
    vision-chat-model:
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: deepseek-flash

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  # 注意：不配置 type-aliases-package，各服务存在同名实体类（如 User）会引发别名冲突；
  # 所有 Mapper XML 均使用全限定类名，无需别名。
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.student.platform: DEBUG
  file:
    name: logs/student-platform.log
